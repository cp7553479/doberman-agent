# Application chart only. MySQL / Redis / MinIO / ES / Milvus / OpenFGA are
# expected to already exist (compose, operator, or another chart). Point the
# hosts below at those Services.

timezone: Asia/Shanghai

imagePullSecrets: []

backend:
  replicaCount: 1
  image:
    repository: doberman-agent-backend
    tag: local
    pullPolicy: IfNotPresent
  service:
    port: 7860
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
  extraEnv: []

worker:
  replicaCount: 1
  image:
    repository: doberman-agent-backend
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
  extraEnv: []

# Task-mode / Linsight worker. The image `entrypoint.sh worker` path does not
# keep this process as PID 1; run it as its own Deployment.
linsight:
  replicaCount: 1
  image:
    repository: doberman-agent-backend
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 4Gi
  extraEnv: []

frontend:
  replicaCount: 1
  image:
    repository: doberman-agent-frontend
    tag: local
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3001
    # Client SPA (base /workspace). 0 disables the extra listen/Service port.
    clientPort: 4001
    clientNodePort: null
    # Bind the node host to clientPort (single-node / no Ingress). Empty = off.
    clientHostPort: null
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  extraEnv: []

# Isolation-environment access. Token must match the doberman-agent-sandbox chart.
# List each replica URL. Do not point this at the ClusterIP Service.
sandbox:
  enabled: true
  token: doberman-agent-sandbox-local
  existingSecret: ""
  existingSecretKey: token
  endpoints:
    - http://code-runner-0.code-runner.doberman-agent-sandbox.svc.cluster.local:8080
    - http://code-runner-1.code-runner.doberman-agent-sandbox.svc.cluster.local:8080

middleware:
  milvus:
    connectionArgs: '{"host":"milvus","port":"19530","user":"","password":"","secure":false}'
    isPartition: "true"
    partitionSuffix: "1"
  elasticsearch:
    url: http://elasticsearch:9200
    sslVerify: "{}"
  minio:
    schema: "false"
    certCheck: "false"
    endpoint: minio:9000
    sharepoint: minio:9000
    accessKey: minioadmin
    secretKey: minioadmin

secrets:
  gatewayHmacSecret: doberman-agent-local-hmac-20260422

# Mounted at /app/doberman_agent/config.yaml. Empty = chart files/config.yaml
# (same as docker/doberman-agent/config/config.yaml). Hosts mysql / redis / openfga
# must resolve in this namespace (or edit the YAML).
config:
  existingConfigMap: ""
  yaml: ""

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: doberman-agent.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: false
  size: 20Gi
  storageClass: ""

nodeSelector: {}
tolerations: []
affinity: {}
