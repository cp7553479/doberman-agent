name: Runtime delivery images
on:
  workflow_dispatch:
    inputs:
      version:
        description: New immutable release identifier
        required: true
        type: string
      publish:
        description: Publish verified native images to this fork's GHCR namespace
        default: false
        type: boolean
permissions:
  contents: read
  packages: write
concurrency:
  group: runtime-images-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, native isolated smoke and inventory
        env:
          RUNTIME_RELEASE: ${{ inputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
          RUNTIME_IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
          RUNTIME_PUBLISH: ${{ inputs.publish && '1' || '0' }}
        run: bash scripts/build_runtime_images.sh
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-images-${{ matrix.arch }}
          path: dist/runtime-images-*.json
  catalog:
    needs: native
    if: inputs.publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-images-*
          merge-multiple: true
          path: dist
      - name: Merge verified native inventories
        run: |
          python src/runtime-manager/runtime_manager/image_catalog.py merge \
            --inventory dist/runtime-images-amd64.json --inventory dist/runtime-images-arm64.json \
            --output dist/runtime-release.json
          python src/runtime-manager/tools/runtime_materials.py catalog \
            --inventory dist/runtime-images-amd64.json --inventory dist/runtime-images-arm64.json \
            --output dist/runtime-profiles.json --revision ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-profiles
          path: |
            dist/runtime-release.json
            dist/runtime-profiles.json
